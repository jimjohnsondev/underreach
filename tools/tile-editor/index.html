<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Underreach Tile Editor</title>
<link rel="stylesheet" href="/editor/editor.css">
</head>
<body>
<header>
  <h1>UNDERREACH TILE EDITOR</h1>
  <span id="status" class="status">Loading…</span>
  <button id="saveBtn" type="button" disabled title="Save changes (Ctrl+S)">SAVE</button>
</header>

<main>
  <!-- Left: everything you can edit -->
  <section class="panel list-panel">
    <div class="tabs" role="tablist">
      <button type="button" class="tab on" data-kind="tiles">TILES</button>
      <button type="button" class="tab" data-kind="sprites">SPRITES</button>
    </div>
    <input id="filter" type="search" placeholder="Filter by name" autocomplete="off">
    <ul id="itemList" class="item-list"></ul>
    <div class="row">
      <button type="button" id="newBtn">NEW</button>
      <button type="button" id="copyBtn">COPY</button>
      <button type="button" id="renameBtn">RENAME</button>
      <button type="button" id="deleteBtn">DELETE</button>
    </div>
  </section>

  <!-- Middle: the picture being edited -->
  <section class="panel edit-panel">
    <div class="row toolbar">
      <button type="button" class="tool on" data-tool="pencil" title="Pencil (P)">PENCIL</button>
      <button type="button" class="tool" data-tool="fill" title="Fill (F)">FILL</button>
      <button type="button" class="tool" data-tool="picker" title="Pick a color from the picture (I)">PICK</button>
      <span class="spacer"></span>
      <button type="button" id="undoBtn" title="Undo (Ctrl+Z)">UNDO</button>
      <button type="button" id="redoBtn" title="Redo (Ctrl+Y)">REDO</button>
    </div>
    <h2 id="itemName">–</h2>
    <canvas id="grid" width="320" height="320" aria-label="Pixel grid"></canvas>
    <p class="hint">Left click paints · right click erases to see-through</p>
    <p class="hint hover" id="hover"></p>
    <div class="row toolbar">
      <button type="button" id="flipHBtn" title="Flip left to right">FLIP ↔</button>
      <button type="button" id="flipVBtn" title="Flip upside down">FLIP ↕</button>
      <button type="button" data-shift="-1,0" title="Move left">←</button>
      <button type="button" data-shift="1,0" title="Move right">→</button>
      <button type="button" data-shift="0,-1" title="Move up">↑</button>
      <button type="button" data-shift="0,1" title="Move down">↓</button>
      <label class="check"><input type="checkbox" id="gridLines" checked> GRID</label>
    </div>
  </section>

  <!-- Right: colors and previews -->
  <section class="panel side-panel">
    <h3>PALETTE</h3>
    <div id="palette" class="palette"></div>
    <p class="hint">Click a color to paint with it. Double-click to change it.</p>
    <div class="row add-color">
      <input id="newKey" maxlength="1" placeholder="key" aria-label="New color key">
      <input id="newColor" type="color" value="#808080" aria-label="New color">
      <button type="button" id="addColorBtn">ADD COLOR</button>
    </div>
    <input id="editColor" type="color" class="offscreen" tabindex="-1" aria-hidden="true">

    <h3>PREVIEW</h3>
    <div class="previews">
      <figure><canvas id="previewOne" width="8" height="16"></canvas><figcaption>ACTUAL ×4</figcaption></figure>
      <figure><canvas id="previewTiled" width="24" height="48"></canvas><figcaption>TILED 3×3</figcaption></figure>
      <figure><canvas id="previewAnim" width="8" height="16"></canvas><figcaption id="animCaption">FRAMES</figcaption></figure>
      <figure id="mirrorFigure" hidden><canvas id="previewMirror" width="8" height="16"></canvas><figcaption>LEFT (MIRRORED)</figcaption></figure>
    </div>
    <label class="field">Ground under see-through pixels
      <select id="groundSelect"></select>
    </label>
  </section>
</main>

<script type="module" src="/editor/editor.js"></script>
</body>
</html>
