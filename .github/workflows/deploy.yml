# Builds the game and publishes it to GitHub Pages whenever main changes.
# It can also be run by hand from the repository's Actions tab.
# In the repository's Settings > Pages, set "Source" to "GitHub Actions" for this to work.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# The Pages deploy needs to write to Pages and prove who it is; nothing else.
permissions:
  contents: read
  pages: write
  id-token: write

# Only one deploy at a time; a newer push replaces one still waiting, but never
# interrupts one already publishing.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Bundles the code into dist/ and copies the art and data JSON next to it.
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
